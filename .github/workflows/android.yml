name: Build FHINIX AI APK 1.2

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm install

      - name: Preparar Android
        run: npx cap add android

      - name: Sincronizar aplicativo
        run: npx cap sync android

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Diagnosticar APK
        run: 
          echo "=== Identidade do APK ==="
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/android-tools.zip
          mkdir -p /tmp/android-tools
          unzip -q /tmp/android-tools.zip -d /tmp/android-tools
          SDKMANAGER=$(find /tmp/android-tools -name sdkmanager | head -1)
          yes | "$SDKMANAGER" --sdk_root=/tmp/android-sdk "platform-tools" "build-tools;35.0.0" >/dev/null
          AAPT=$(find /tmp/android-sdk/build-tools/35.0.0 -name aapt | head -1)
          APKSIGNER=$(find /tmp/android-sdk/build-tools/35.0.0 -name apksigner | head -1)
          "$AAPT" dump badging android/app/build/outputs/apk/debug/app-debug.apk | head -5
          "$APKSIGNER" verify --verbose android/app/build/outputs/apk/debug/app-debug.apk

          echo "=== Informações do APK ==="
          ls -lh android/app/build/outputs/apk/debug/
          echo "=== SDK mínimo ==="
          grep -R "minSdk" android/app/build.gradle android/variables.gradle 2>/dev/null || true
          echo "=== SDK alvo ==="
          grep -R "targetSdk" android/app/build.gradle android/variables.gradle 2>/dev/null || true
          
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: FHINIX-AI-APK-1.2
          path: android/app/build/outputs/apk/debug/app-debug.apk
